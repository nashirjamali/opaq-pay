# Production stack behind an existing Traefik (docker provider, certresolver "letsencrypt", host network).
#   cp deploy/.env.example .env   # fill in, then:
#   docker compose -f deploy/compose.prod.yaml up -d --build
# Run from the repo root. The relayer key stays on the host (RELAYER_KEYPAIR_FILE), mounted read-only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: opaq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: opaq
    volumes:
      - db:/var/lib/postgresql/data
    networks: [opaq]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opaq"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://opaq:${POSTGRES_PASSWORD}@db:5432/opaq
      RPC_URL: ${RPC_URL:-https://api.devnet.solana.com}
      OPAQ_CLUSTER: ${OPAQ_CLUSTER:-devnet}
      INDEXER_COMMITMENT: ${INDEXER_COMMITMENT:-finalized}
      RELAYER_KEYPAIR_PATH: /run/secrets/relayer.json
      RELAYER_MAX_LAMPORTS_PER_TX: ${RELAYER_MAX_LAMPORTS_PER_TX:-20000000}
      RELAYER_DAILY_LAMPORT_BUDGET: ${RELAYER_DAILY_LAMPORT_BUDGET:-2000000000}
      RELAYER_REQUESTS_PER_MINUTE: ${RELAYER_REQUESTS_PER_MINUTE:-60}
      TRUST_PROXY: "true"
    volumes:
      - ${RELAYER_KEYPAIR_FILE:?set RELAYER_KEYPAIR_FILE}:/run/secrets/relayer.json:ro
    networks: [opaq]
    labels:
      traefik.enable: "true"
      traefik.docker.network: opaq_default
      traefik.http.routers.opaq-api.rule: Host(`${API_DOMAIN:-api.opaq.nashir.tech}`)
      traefik.http.routers.opaq-api.entrypoints: websecure
      traefik.http.routers.opaq-api.tls.certresolver: letsencrypt
      traefik.http.services.opaq-api.loadbalancer.server.port: "8787"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_OPAQ_CLUSTER: ${OPAQ_CLUSTER:-devnet}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_OPAQ_SERVER_URL: https://${API_DOMAIN:-api.opaq.nashir.tech}
    networks: [opaq]
    labels:
      traefik.enable: "true"
      traefik.docker.network: opaq_default
      traefik.http.routers.opaq-web.rule: Host(`${WEB_DOMAIN:-opaq.nashir.tech}`)
      traefik.http.routers.opaq-web.entrypoints: websecure
      traefik.http.routers.opaq-web.tls.certresolver: letsencrypt
      traefik.http.services.opaq-web.loadbalancer.server.port: "3000"
    restart: unless-stopped

networks:
  opaq:
    name: opaq_default

volumes:
  db:
